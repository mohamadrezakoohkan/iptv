<!-- ADR: ADR-0001, ADR-0004, ADR-0005, ADR-0008, ADR-0010, ADR-0014, ADR-0016, ADR-0017, ADR-0019, ADR-0023, ADR-0027, ADR-0028, ADR-0030, ADR-0034 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <div class="app-main">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span class="brand-dot"></span>
          <span class="brand-name">IPTV</span>
        </div>
        <div class="sidebar-search">
          <div class="search-field">
            <input id="search" type="text" placeholder="Search channels…" autocomplete="off">
          </div>
        </div>
        <div class="sidebar-list" id="grp-nav"></div>
      </aside>
      <main class="content">
        <div class="content-head">
          <div class="on-air-badge" id="on-air-badge">
            <span class="on-air-dot"></span>ON AIR
          </div>
          <span class="now-title" id="now-info"></span>
          <!-- ADR: ADR-0025 — single contextual, clickable format chip; hidden until a channel plays -->
          <button type="button" class="fmt-chip" id="fmt-chip" aria-expanded="false" hidden>HLS</button>
          <span class="fmt-detail" id="fmt-detail" hidden></span>
          <!-- sun/moon theme toggle (ADR-0019) — top-right, immediately before the account button -->
          <button type="button" class="thm-toggle" id="theme-toggle" role="switch" aria-checked="false" aria-label="Toggle light theme">
            <svg class="thm-ico thm-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
              <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="12" y1="2.5" x2="12" y2="5"/>
                <line x1="12" y1="19" x2="12" y2="21.5"/>
                <line x1="2.5" y1="12" x2="5" y2="12"/>
                <line x1="19" y1="12" x2="21.5" y2="12"/>
                <line x1="5.2" y1="5.2" x2="7" y2="7"/>
                <line x1="17" y1="17" x2="18.8" y2="18.8"/>
                <line x1="18.8" y1="5.2" x2="17" y2="7"/>
                <line x1="7" y1="17" x2="5.2" y2="18.8"/>
              </g>
            </svg>
            <svg class="thm-ico thm-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5z" fill="currentColor"/>
            </svg>
          </button>
          <!-- log button (ADR-0028) — immediately before #acct-btn so the pair sits at the right edge; #acct-btn keeps margin-left:auto -->
          <button type="button" class="log-btn" id="log-btn" aria-haspopup="dialog" aria-controls="log-panel" aria-expanded="false">
            <svg class="log-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <span class="log-label">Log</span>
            <span class="log-count is-empty" id="log-count" aria-hidden="true"></span>
          </button>
          <button type="button" class="acct-btn" id="acct-btn" aria-haspopup="dialog" aria-controls="acct-panel" aria-expanded="false">
            <svg class="acct-ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="12" cy="8" r="4" fill="currentColor"/>
              <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" fill="currentColor"/>
            </svg>
            <span class="acct-label" id="acct-label">Account</span>
          </button>
        </div>
        <div class="player-wrap" id="player-wrap">
          <div id="player-card" class="player-card player-idle">
            <video id="player-video" controls playsinline style="display:none"></video>
            <div class="player-idle" id="player-idle" role="status"></div>
            <div class="player-err" id="player-err" role="alert" style="display:none"></div>
          </div>
        </div>
        <div class="ch-section">
          <div class="ch-bar">
            <!-- ADR: ADR-0038 — Live | Movies | Series content toggle. Options are real
                 buttons with aria-pressed PRESENT in the baseline (Rule R-0001); Movies/Series
                 carry `hidden` until window.IptvVod has them (contextual presence). The builder
                 (rndToggle, ui.js) only flips aria-pressed/hidden, never adds aria at runtime. -->
            <div class="content-toggle" id="content-toggle" role="group" aria-label="Content type">
              <button type="button" class="ct-opt active" data-mode="live" aria-pressed="true">Live</button>
              <button type="button" class="ct-opt" data-mode="movies" aria-pressed="false" hidden>Movies</button>
              <button type="button" class="ct-opt" data-mode="series" aria-pressed="false" hidden>Series</button>
            </div>
            <span class="ch-bar-count" id="ch-count"></span>
            <div class="ch-bar-sort">
              <label class="ch-sort-label" for="ch-sort">Sort</label>
              <select class="ch-sort" id="ch-sort" aria-label="Sort channels"></select>
            </div>
          </div>
          <div class="ch-grid" id="ch-list"></div>
        </div>
      </main>
    </div>
    <footer class="footer" id="footer">
      <div class="footer-login" id="footer-login">
        <form class="footer-form" id="login-form" autocomplete="on">
          <div class="field field-mode">
            <label id="login-mode-label">Login mode</label>
            <div class="login-mode" id="login-mode" role="radiogroup" aria-labelledby="login-mode-label">
              <label class="mode-opt">
                <input type="radio" name="login-mode" id="mode-xtream" value="xtream" checked>
                <span class="mode-txt">Username &amp; Password</span>
              </label>
              <label class="mode-opt">
                <input type="radio" name="login-mode" id="mode-m3u" value="m3u">
                <span class="mode-txt">Playlist URL only</span>
              </label>
            </div>
          </div>
          <div class="field grow-2">
            <label for="f-url">Portal URL</label>
            <input id="f-url" type="text" placeholder="http://portal.example.com:8080" autocomplete="url" />
          </div>
          <div class="field field-user">
            <label for="f-user">Username</label>
            <input id="f-user" type="text" placeholder="username" autocomplete="username" />
          </div>
          <div class="field field-pass">
            <label for="f-pass">Password</label>
            <input id="f-pass" type="password" placeholder="password" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary" id="btn-conn" disabled>
            Connect
          </button>
        </form>
        <div class="footer-hint" id="footer-hint">Type "demo" to try a sample playlist.</div>
        <div class="footer-error" id="footer-err" style="display:none"></div>
      </div>
      <div class="footer-conn" id="footer-conn" style="display:none">
        <div class="footer-status">
          <span class="status-dot"></span>
          <span class="status-text" id="conn-text"></span>
          <button type="button" class="btn btn-ghost" id="btn-disc">Disconnect</button>
        </div>
      </div>
    </footer>
    <!-- playback failure log scrim + slide-in panel (ADR-0028), parallel to the account panel -->
    <div class="log-scrim" id="log-scrim"></div>
    <aside class="log-panel" id="log-panel" role="dialog" aria-label="Playback failure log" aria-hidden="true">
      <div class="log-head">
        <span class="log-title">Playback log</span>
        <button type="button" class="log-clear" id="log-clear">Clear</button>
        <button type="button" class="log-close" id="log-close" aria-label="Close playback log panel">&#10005;</button>
      </div>
      <div class="log-list" id="log-list"></div>
    </aside>
    <!-- reminder firing toast stack (ADR-0034) — transient, dismissible toasts
         announcing a fired reminder, with a Watch/Jump action. The container is
         an aria-live region so a fired toast is announced to assistive tech
         (specs/reminders.md §5, §8); each toast is built on demand by ui.js. -->
    <div class="rem-toasts" id="rem-toasts" role="region" aria-live="polite" aria-label="Reminders"></div>
    <div class="acct-scrim" id="acct-scrim"></div>
    <aside class="acct-panel" id="acct-panel" role="dialog" aria-label="Accounts" aria-hidden="true">
      <div class="acct-head">
        <span class="acct-title">Accounts</span>
        <button type="button" class="acct-close" id="acct-close" aria-label="Close accounts panel">&#10005;</button>
      </div>
      <div class="acct-conn" id="acct-conn"></div>
      <div class="acct-list" id="acct-list"></div>
      <!-- ADR: ADR-0016 — community presets section (default, selectable) -->
      <div class="acct-psts-sec">
        <span class="acct-psts-title">Community playlists</span>
        <div class="acct-psts" id="acct-psts"></div>
      </div>
      <button type="button" class="btn btn-ghost acct-add" id="acct-add">Add account</button>
    </aside>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
  <script src="/cfg.js"></script>
  <script src="/api.js"></script>
  <script src="/st.js"></script>
  <script src="/srch.js"></script>
  <script src="/errlog.js"></script>
  <script src="/epg.js"></script>
  <!-- ADR: ADR-0032 — program-reminders store; loaded after epg.js, before ui.js -->
  <script src="/rem.js"></script>
  <!-- ADR: ADR-0037 — VOD (Movies & Series) store + normalizers + URL builders -->
  <script src="/vod.js"></script>
  <script src="/play.js"></script>
  <script src="/empty.js"></script>
  <script src="/ui.js"></script>
  <script src="/nav.js"></script>
  <script src="/main.js"></script>
</body>
</html>
